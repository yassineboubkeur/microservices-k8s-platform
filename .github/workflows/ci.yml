name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  USERNAME: yassineboubkeur

jobs:
  build-api-gateway:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: services/api-gateway/package-lock.json
      - name: Install dependencies
        working-directory: services/api-gateway
        run: npm install
      - name: Run tests
        working-directory: services/api-gateway
        run: npm test
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: yassineboubkeur
          password: ${{ secrets.CR_PAT }}
      - name: Build and push API Gateway
        uses: docker/build-push-action@v5
        with:
          context: ./services/api-gateway
          push: true
          tags: |
            ghcr.io/${{ env.USERNAME }}/api-gateway:latest
            ghcr.io/${{ env.USERNAME }}/api-gateway:${{ github.sha }}

  build-user-service:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: services/user-service/package-lock.json
      - name: Install dependencies
        working-directory: services/user-service
        run: npm install
      - name: Run tests
        working-directory: services/user-service
        run: npm test
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: yassineboubkeur
          password: ${{ secrets.CR_PAT }}
      - name: Build and push User Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/user-service
          push: true
          tags: |
            ghcr.io/${{ env.USERNAME }}/user-service:latest
            ghcr.io/${{ env.USERNAME }}/user-service:${{ github.sha }}

  build-product-service:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        working-directory: services/product-service
        run: pip install -r requirements.txt
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: yassineboubkeur
          password: ${{ secrets.CR_PAT }}
      - name: Build and push Product Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/product-service
          push: true
          tags: |
            ghcr.io/${{ env.USERNAME }}/product-service:latest
            ghcr.io/${{ env.USERNAME }}/product-service:${{ github.sha }}

  update-image-tags:
    runs-on: ubuntu-latest
    needs: [build-api-gateway, build-user-service, build-product-service]
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CR_PAT }}
      - name: Update image tags in Helm values
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          sed -i "s/tag: .*/tag: $SHORT_SHA/" helm/api-gateway/values.yaml
          sed -i "s/tag: .*/tag: $SHORT_SHA/" helm/user-service/values.yaml
          sed -i "s/tag: .*/tag: $SHORT_SHA/" helm/product-service/values.yaml
      - name: Commit and push updated tags
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add helm/*/values.yaml
          git diff --staged --quiet || git commit -m "ci: update image tags to $SHORT_SHA"
          git push